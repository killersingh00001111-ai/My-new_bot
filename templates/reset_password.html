{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Reset password</h1>
  <form method="post">
    <input type="hidden" name="username" value="{{ username }}">
    <label>Username</label>
    <input type="text" value="{{ username }}" disabled>
    <label>Reset code</label>
    <input type="text" name="code" required>
    <label>New password</label>
    <input type="password" name="new_password" required minlength="6">
    <button type="submit">Reset password</button>
  </form>

  <div id="resend-wrap" style="margin-top:12px;">
    <button type="button" id="resend-btn" disabled>Resend code (<span id="resend-timer">20</span>s)</button>
    <p id="resend-message" style="margin-top:8px;"></p>
  </div>
</div>

<script>
(function () {
  const RESEND_SECONDS = 20;
  const username = {{ username|tojson }};
  const btn = document.getElementById("resend-btn");
  const timerEl = document.getElementById("resend-timer");
  const messageEl = document.getElementById("resend-message");
  let secondsLeft = RESEND_SECONDS;
  let intervalId = null;

  function startCountdown() {
    secondsLeft = RESEND_SECONDS;
    btn.disabled = true;
    timerEl.textContent = secondsLeft;
    btn.textContent = "Resend code (" + secondsLeft + "s)";

    clearInterval(intervalId);
    intervalId = setInterval(function () {
      secondsLeft -= 1;
      if (secondsLeft <= 0) {
        clearInterval(intervalId);
        btn.disabled = false;
        btn.textContent = "Resend code";
      } else {
        btn.textContent = "Resend code (" + secondsLeft + "s)";
      }
    }, 1000);
  }

  btn.addEventListener("click", function () {
    btn.disabled = true;
    messageEl.textContent = "Sending...";

    const formData = new FormData();
    formData.append("username", username);

    fetch("{{ url_for('auth.resend_otp') }}", {
      method: "POST",
      body: formData,
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        messageEl.textContent = data.message || "A new code has been sent.";
        startCountdown();
      })
      .catch(function () {
        messageEl.textContent = "Something went wrong sending the code. Try again.";
        btn.disabled = false;
        btn.textContent = "Resend code";
      });
  });

  // Countdown starts immediately on page load, since a code was just sent
  // by the forgot-password step that brought the user here.
  startCountdown();
})();
</script>
{% endblock %}
