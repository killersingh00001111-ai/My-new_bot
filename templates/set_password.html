{% extends "base.html" %}
{% block title %}Set your password{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Enter your new lock 🔒</h1>
  <p class="hint">
    This is a one-time step. Choose a password you'll remember - you'll
    use it to log in from now on. (If you ever forget it, the owner can
    reset it for you.)
  </p>
  <form method="post">
    <label>New password</label>
    <input type="password" name="new_password" required minlength="8" autofocus>
    <label>Confirm password</label>
    <input type="password" name="confirm_password" required minlength="8">
    <button type="submit">Save password</button>
  </form>
</div>
{% endblock %}
